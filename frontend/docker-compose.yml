services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4011}
        VITE_REDIRECT_BASE_DOMAIN: ${VITE_REDIRECT_BASE_DOMAIN:-}
        VITE_ADMIN_API_KEY: ${VITE_ADMIN_API_KEY:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
