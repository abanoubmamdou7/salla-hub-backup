name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/asuscard-sa/sallahub-frontend:latest
          build-args: |
            VITE_ADMIN_API_KEY=${{ secrets.VITE_ADMIN_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          # The VM's docker can't pull OCI indexes that carry provenance/SBOM
          # attestation manifests ("NotFound: content digest ... not found") —
          # push a plain image manifest instead.
          provenance: false
          sbom: false

      - name: Deploy to VM2
        run: |
          echo "${{ secrets.JUMP_KEY }}"   > /tmp/jump.key   && chmod 600 /tmp/jump.key
          echo "${{ secrets.DEPLOY_KEY }}" > /tmp/deploy.key && chmod 600 /tmp/deploy.key
          ssh -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -W %h:%p -i /tmp/jump.key -o StrictHostKeyChecking=no ubuntu@${{ secrets.JUMP_HOST }}" \
            -i /tmp/deploy.key root@${{ secrets.DEPLOY_HOST }} \
            'cd /opt/koun/sallahub-frontend && docker compose pull && docker compose up -d && docker image prune -f'
